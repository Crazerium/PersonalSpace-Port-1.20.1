description='''
Personal Space adds private configurable dimensions for players.

Requires Infiniverse API.

Create your own personal world, customize its terrain, sky, time, weather,
world border, and visual style. Designed for modpacks where players need
safe isolated building spaces without overloading the main world.

Forge 1.20.1 port by Crazerium.
'''

