plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'me.eigenraven.personalspace'

base {
    archivesName = 'personalspace-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    maven {
        name = 'Commoble Maven'
        url = 'https://maven.commoble.net/'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("commoble.infiniverse:infiniverse-1.20.1:${infiniverse_version}")
    implementation 'com.google.code.gson:gson:2.10.1'
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
    runtimeOnly fg.deobf("curse.maven:cryonicconfig-1208896:6247797")
    runtimeOnly fg.deobf("curse.maven:chisel-reborn-551763:6266130")
    runtimeOnly fg.deobf("curse.maven:xtones-reworked-694231:5907303")
    runtimeOnly fg.deobf("curse.maven:gregtechceu-modern-890405:7917773")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "personalspace.refmap.json"
    config "personalspace.mixins.json"
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "personalspace.mixins.json"
        ])
    }
}